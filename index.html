@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; }

.mm-app {
  height: 100vh;
  height: 100dvh;
  width: 100%;
  display: flex;
  flex-direction: column;
  font-family: 'Noto Sans KR', system-ui, sans-serif;
  color: #2B2A25;
  background: #F1EEE6;
  overflow: hidden;
}

.mm-loading {
  height: 100vh; width: 100%; display: flex; align-items: center; justify-content: center;
  gap: 8px; background: #F1EEE6; color: #8A8370; font-family: 'Noto Sans KR', sans-serif; font-size: 13px;
}

.mm-topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; background: #FBFAF7; border-bottom: 1px solid #E2DCCC;
  flex-shrink: 0; flex-wrap: wrap;
}

.mm-icon-btn {
  display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border: none; background: transparent;
  border-radius: 7px; color: #5C5646; cursor: pointer; flex-shrink: 0;
}
.mm-icon-btn:hover { background: #F1EEE6; }

.mm-historygroup { display: flex; align-items: center; gap: 1px; flex-shrink: 0; }
.mm-historygroup button {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border: none; background: transparent;
  border-radius: 7px; color: #5C5646; cursor: pointer;
}
.mm-historygroup button:hover:not(:disabled) { background: #F1EEE6; }
.mm-historygroup button:disabled { opacity: 0.3; cursor: default; }

.mm-name-input {
  flex: 1; min-width: 90px; max-width: 320px;
  font-family: 'Noto Sans KR', sans-serif; font-size: 14.5px; font-weight: 600;
  color: #2B2A25; background: transparent; border: none; outline: none;
  padding: 5px 7px; border-radius: 5px;
}
.mm-name-input:focus { background: #F1EEE6; }

.mm-dirgroup {
  display: flex; background: #F1EEE6; border: 1px solid #E2DCCC;
  border-radius: 8px; padding: 2px; gap: 2px; flex-shrink: 0;
}
.mm-dirgroup button {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 28px; border: none; background: transparent;
  border-radius: 6px; color: #6B6552; cursor: pointer;
}
.mm-dirgroup button.active { background: #1F3B36; color: #F4EFE3; }
.mm-dirgroup button:hover:not(.active) { background: #E9E4D6; }

.mm-formatgroup {
  display: flex; align-items: center; gap: 2px; flex-shrink: 0;
  background: #F1EEE6; border: 1px solid #E2DCCC; border-radius: 8px; padding: 2px;
}
.mm-formatgroup button {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 26px; border: none; background: transparent;
  border-radius: 6px; color: #6B6552; cursor: pointer;
}
.mm-formatgroup button:hover:not(:disabled):not(.active) { background: #E9E4D6; }
.mm-formatgroup button.active { background: #1F3B36; color: #F4EFE3; }
.mm-formatgroup button:disabled { opacity: 0.35; cursor: default; }

.mm-shapegroup {
  display: flex; align-items: center; gap: 2px; flex-shrink: 0;
  background: #F1EEE6; border: 1px solid #E2DCCC; border-radius: 8px; padding: 2px;
}
.mm-shapegroup button {
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 26px; border: none; background: transparent;
  border-radius: 6px; color: #6B6552; cursor: pointer;
}
.mm-shapegroup button:hover:not(:disabled):not(.active) { background: #E9E4D6; }
.mm-shapegroup button.active { background: #1F3B36; color: #F4EFE3; }
.mm-shapegroup button:disabled { opacity: 0.35; cursor: default; }

.mm-swatch-wrap { position: relative; flex-shrink: 0; }
.mm-color-swatch {
  position: relative; width: 26px; height: 26px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  border: none; background: transparent; padding: 0;
}
.mm-color-swatch:hover:not(:disabled) { background: #E9E4D6; }
.mm-color-swatch:disabled { opacity: 0.4; cursor: default; }
.mm-color-swatch span {
  width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.15);
  pointer-events: none;
}
.mm-swatch-icon {
  position: absolute; top: 0; left: 0; color: #FBFAF7;
  background: #221F19; border-radius: 3px; padding: 1px; pointer-events: none;
}

.mm-palette-popover {
  position: absolute; top: calc(100% + 6px); left: 0;
